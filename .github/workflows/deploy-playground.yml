name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许 Pages 工作流为每次推送自动构建
permissions:
  contents: read
  pages: write
  id-token: write
  # 允许使用自动生成的 GITHUB_TOKEN 拉取组织私有包（GitHub Packages）
  packages: read

# 同一时间只允许一个部署在进行，跳过队列中并发的运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # npm 认证 token：优先使用显式配置的 NPM_TOKEN（PAT），
      # 未配置时回退到自动生成的 GITHUB_TOKEN，供 .npmrc 使用。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
